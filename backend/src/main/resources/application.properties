spring.application.name=intelligent-farm-platform
server.port=${PORT:8080}

# --- Database (override via environment; no real credentials are committed) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/intelligent_farm}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.spatial.enabled=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- Security ---
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# --- Observability / docs ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui

# --- Integrations ---
weather.provider.url=${WEATHER_PROVIDER_URL:https://api.open-meteo.com/v1/forecast}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
notifications.cron=${NOTIFICATIONS_CRON:0 0 6 * * *}

# --- Uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
farm.documents.directory=${DOCUMENTS_DIRECTORY:${user.home}/.farmverse/documents}
app.upload-dir=${DOCUMENTS_DIRECTORY:${user.home}/.farmverse/documents}
