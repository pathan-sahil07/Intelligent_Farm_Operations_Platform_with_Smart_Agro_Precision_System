spring.application.name=intelligent-farm-platform
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/intelligent_farm}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.spatial.enabled=true
weather.provider.url=${WEATHER_PROVIDER_URL:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
farm.documents.directory=${DOCUMENTS_DIRECTORY:${user.home}/.farmverse/documents}
app.upload-dir=${DOCUMENTS_DIRECTORY:${user.home}/.farmverse/documents}
