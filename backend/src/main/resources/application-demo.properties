spring.datasource.url=jdbc:h2:mem:farmdemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
farm.documents.directory=${java.io.tmpdir}/farmverse-documents
app.upload-dir=${java.io.tmpdir}/farmverse-documents
weather.provider.url=${WEATHER_PROVIDER_URL:https://api.open-meteo.com/v1/forecast}
# Demo only: the JwtService generates a random per-run secret when JWT_SECRET is unset.
# Seed an administrator for the demo with ADMIN_EMAIL / ADMIN_PASSWORD environment variables.
